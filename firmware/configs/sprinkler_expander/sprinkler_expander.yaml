substitutions:
  entity_id: sprinkler
  mcp_address: 0x20


mcp23017:
  - id: ${entity_id}_mcp
    address: ${mcp_address}

binary_sensor:
  - platform: gpio
    name: ${entity_id}_in0
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 8
      mode: INPUT
      inverted: True
    id: ${entity_id}_in0
  - platform: gpio
    name: ${entity_id}_in1
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 9
      mode: INPUT
      inverted: True
    id: ${entity_id}_in1
  - platform: gpio
    name: ${entity_id}_in2
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 10
      mode: INPUT
      inverted: True
    id: ${entity_id}_in2
  - platform: gpio
    name: ${entity_id}_in3
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 11
      mode: INPUT
      inverted: True
    id: ${entity_id}_in3
  - platform: gpio
    name: ${entity_id}_in4
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 12
      mode: INPUT
      inverted: True
    id: ${entity_id}_in4
  - platform: gpio
    name: ${entity_id}_in5
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 13
      mode: INPUT
      inverted: True
    id: ${entity_id}_in5
  - platform: gpio
    name: ${entity_id}_in6
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 14
      mode: INPUT
      inverted: True
    id: ${entity_id}_in6
  - platform: gpio
    name: ${entity_id}_in7
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 15
      mode: INPUT
      inverted: True
    id: ${entity_id}_in7
    
switch:
  - platform: gpio
    id: ${entity_id}_valve_1
    name: "${entity_id} valve 1"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 0
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_2
    name: "${entity_id} valve 2"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 1
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_3
    name: "${entity_id} valve 3"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 2
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_4
    name: "${entity_id} valve 4"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 3
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_5
    name: "${entity_id} valve 5"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 4
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_6
    name: "${entity_id} valve 6"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 5
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_7
    name: "${entity_id} valve 7"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 6
      mode: OUTPUT
      inverted: True

  - platform: gpio
    id: ${entity_id}_valve_8
    name: "${entity_id} valve 8"
    internal: true
    pin:
      mcp23xxx: ${entity_id}_mcp
      number: 7
      mode: OUTPUT
      inverted: True


sprinkler:
  - id: ${entity_id}_sprinkler
    main_switch: "${entity_id}_start"
    auto_advance_switch: "${entity_id}_auto"
    reverse_switch: "${entity_id}_reverse"
    multiplier_number: "${entity_id}_multiplier"
    repeat_number: "${entity_id}_repeats"
    valve_overlap: 5s

    valves:
      - valve_switch: ${entity_id}_zone_1
        enable_switch: ${entity_id}_enable_zone_1
        run_duration_number:
          name: "${entity_id}_zone_1_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_1

      - valve_switch: ${entity_id}_zone_2
        enable_switch: ${entity_id}_enable_zone_2
        run_duration_number:
          name: "${entity_id}_zone_2_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_2

      - valve_switch: ${entity_id}_zone_3
        enable_switch: ${entity_id}_enable_zone_3
        run_duration_number:
          name: "${entity_id}_zone_3_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_3

      - valve_switch: ${entity_id}_zone_4
        enable_switch: ${entity_id}_enable_zone_4
        run_duration_number:
          name: "${entity_id}_zone_4_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_4

      - valve_switch: ${entity_id}_zone_5
        enable_switch: ${entity_id}_enable_zone_5
        run_duration_number:
          name: "${entity_id}_zone_5_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_5

      - valve_switch: ${entity_id}_zone_6
        enable_switch: ${entity_id}_enable_zone_6
        run_duration_number:
          name: "${entity_id}_zone_6_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_6

      - valve_switch: ${entity_id}_zone_7
        enable_switch: ${entity_id}_enable_zone_7
        run_duration_number:
          name: "${entity_id}_zone_7_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_7

      - valve_switch: ${entity_id}_zone_8
        enable_switch: ${entity_id}_enable_zone_8
        run_duration_number:
          name: "${entity_id}_zone_8_time"
          initial_value: 5
          unit_of_measurement: min
        valve_switch_id: ${entity_id}_valve_8


text_sensor:
  - platform: template
    name: "${entity_id}_remaining_current_zone_time"
    id: ${entity_id}_remaining_current_zone_time
    update_interval: never
    lambda: |-
      auto t = id(${entity_id}_sprinkler).time_remaining_active_valve();
      if (t.has_value()) {
        int sec = t.value();
        char buf[10];
        sprintf(buf, "%02d:%02d", sec/60, sec%60);
        return {buf};
      }
      return {"--:--"};

  - platform: template
    name: "${entity_id}_remaining_total_time"
    id: ${entity_id}_remaining_total_time
    update_interval: never
    lambda: |-
      auto t = id(${entity_id}_sprinkler).time_remaining_current_operation();
      if (t.has_value()) {
        int sec = t.value();
        char buf[10];
        sprintf(buf, "%02d:%02d", sec/60, sec%60);
        return {buf};
      }
      return {"--:--"};

# Skrypt do aktualizacji sensorów
script:
  - id: update_sprinkler_sensors
    mode: single
    then:
      - component.update: ${entity_id}_remaining_current_zone_time
      - component.update: ${entity_id}_remaining_total_time

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(sprinklers_sprinkler).active_valve().has_value();'
          then:
            - script.execute: update_sprinkler_sensors
          else:  # ✅ DOBRZE - else wewnątrz if
            - if:
                condition:
                  lambda: 'return id(sprinklers_remaining_current_zone_time).state != "--:--";'
                then:
                  - script.execute: update_sprinkler_sensors
