    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: >-
          sensor.garaz_automationnode_garage_sprinklers_remaining_current_zone_time
        name: Pozostały czas podlewania obecnej sekcji
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        name: Pozostały czas podlewania całości
        entity: sensor.garaz_automationnode_garage_sprinklers_remaining_total_time
    max_columns: 4
    title: Sterowanie
    cards: []
  - type: sections
    max_columns: 4
    title: Harmonogram
    path: harmonogram
    sections:
      - type: grid
        cards:
          - type: entities
            title: Harmonogram podlewania
            entities:
              - schedule.podlewanie_harmonogram
      - type: grid
        cards:
          - type: heading
            heading: Nowa sekcja
