views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: horizontal-stack
            title: System Nawadniania
            cards:
              - show_name: true
                show_icon: true
                type: button
                entity: switch.garaz_automationnode_garage_sprinklers_start
                name: Włącz cykl
                icon: mdi:play-circle
                tap_action:
                  action: toggle
              - type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: gauge
                        entity: sensor.garaz_automationnode_garage_wifi_sygnal_procent
                        name: WiFi
                        min: 0
                        max: 100
                      - type: button
                        name: Reset
                        entity: >-
                          button.garaz_automationnode_garage_automation_node_restart
                        icon: mdi:restart
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.podlewanie_restart_sterownika_podlewania
                  - type: horizontal-stack
                    cards:
                      - type: gauge
                        entity: >-
                          number.garaz_automationnode_garage_sprinklers_multiplier
                        name: Mnożnik
                        min: 0
                        max: 5
                      - type: gauge
                        entity: number.garaz_automationnode_garage_sprinklers_repeats
                        name: Powtórzenia
                        min: 0
                        max: 5
                      - show_name: true
                        name: Odwrotna kolejność
                        show_icon: true
                        type: button
                        entity: switch.garaz_automationnode_garage_sprinklers_reverse
                        icon: mdi:swap-horizontal
                        tap_action:
                          action: toggle
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: horizontal-stack
            title: tbd 1
            cards:
              - show_name: false
                show_icon: true
                type: button
                entity: switch.garaz_automationnode_garage_sprinklers_zone_1
                name: tbd
                icon: mdi:sprinkler
                tap_action:
                  action: toggle
              - type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: gauge
                        entity: >-
                          number.garaz_automationnode_garage_sprinklers_zone_1_time
                        name: Czas
                        min: 1
                        max: 30
                        needle: false
                      - show_name: true
                        show_icon: true
                        type: button
                        name: W cyklu podlewania
                        entity: >-
                          switch.garaz_automationnode_garage_sprinklers_enable_zone_1
                        icon: mdi:check-circle-outline
                        tap_action:
                          action: toggle
                  - type: horizontal-stack
                    cards:
                      - type: history-graph
                        entities:
                          - entity: >-
                              switch.garaz_automationnode_garage_sprinklers_zone_1
                            name: Zawór
                        hours_to_show: 22
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: horizontal-stack
            title: tbd 2
            cards:
              - show_name: false
                show_icon: true
                type: button
                entity: switch.garaz_automationnode_garage_sprinklers_zone_2
                name: tbd
                icon: mdi:sprinkler
                tap_action:
                  action: toggle
              - type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: gauge
                        entity: >-
                          number.garaz_automationnode_garage_sprinklers_zone_2_time
                        name: Czas
                        min: 1
                        max: 30
                        needle: false
                      - show_name: true
                        show_icon: true
                        type: button
                        name: W cyklu podlewania
                        entity: >-
                          switch.garaz_automationnode_garage_sprinklers_enable_zone_2
                        icon: mdi:check-circle-outline
                        tap_action:
                          action: toggle
                  - type: horizontal-stack
                    cards:
                      - type: history-graph
                        entities:
                          - entity: >-
                              switch.garaz_automationnode_garage_sprinklers_zone_2
                            name: Zawór
                        hours_to_show: 22
      - type: grid
        cards:
          - type: heading
            heading_style: title
          - type: horizontal-stack
            title: tbd 3
            cards:
              - show_name: false
                show_icon: true
                type: button
                entity: switch.garaz_automationnode_garage_sprinklers_zone_3
                name: tbd
                icon: mdi:sprinkler
                tap_action:
                  action: toggle
              - type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: gauge
                        entity: >-
                          number.garaz_automationnode_garage_sprinklers_zone_3_time
                        name: Czas
                        min: 1
                        max: 30
                        needle: false
                      - show_name: true
                        show_icon: true
                        type: button
                        name: W cyklu podlewania
                        entity: >-
                          switch.garaz_automationnode_garage_sprinklers_enable_zone_3
                        icon: mdi:check-circle-outline
                        tap_action:
                          action: toggle
                  - type: horizontal-stack
                    cards:
                      - type: history-graph
                        entities:
                          - entity: >-
                              switch.garaz_automationnode_garage_sprinklers_zone_3
                            name: Zawór
                        hours_to_show: 22
